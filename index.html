<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="籃球記分板">
  <title>籃球記分板</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --btn-bg: #222222;
      --border-color: #333333;
      --primary-yellow: #ffcc00;
      --home-red: #ff453a;
      --guest-blue: #0a84ff;
      --green-btn: #34c759;
      --red-btn: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* 頂部導覽列 */
    header {
      height: 38px;
      background-color: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .app-title {
      color: var(--primary-yellow);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .nav-btn {
      background-color: var(--btn-bg);
      border: 1px solid #444444;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 計時區 (極致壓縮垂直空間) */
    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 0 6px 0;
      flex-shrink: 0;
    }

    .timer-display {
      font-family: "SF Pro Text", "Courier New", monospace;
      font-size: 11vh;
      font-weight: 800;
      color: var(--primary-yellow);
      line-height: 1;
    }

    .timer-controls {
      display: flex;
      gap: 16px;
      margin-top: 4px;
    }

    .ctrl-btn {
      width: 95px;
      height: 36px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
    }

    /* 記分主區 (雙欄獨立) */
    .scoreboard {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 16px;
      padding: 0 16px 16px 16px;
      min-height: 0;
    }

    .team-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      width: 50%;
    }

    .team-name {
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .home-title { color: var(--home-red); }
    .guest-title { color: var(--guest-blue); }

    /* 分數框：緊湊滿版設計 */
    .score-box {
      flex: 1;
      background-color: #000000;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      min-height: 0;
      overflow: hidden;
      container-type: size; /* 讓內部文字精準依照容器大小伸縮 */
    }

    .score-number {
      font-size: 68cqh; /* 自動塞滿 68% 的黑框垂直高度 */
      font-weight: 800;
      line-height: 1;
    }

    .home-score { color: var(--home-red); }
    .guest-score { color: var(--guest-blue); }

    /* 3, 2, 1, -1 按鈕區 (顯著加大高度至 75px，增加手感與間距) */
    .score-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      height: 75px;
      flex-shrink: 0;
      width: 100%;
    }

    .score-btn {
      background-color: var(--btn-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-start { background-color: var(--green-btn); }
    .btn-reset { background-color: var(--red-btn); }
    
    .score-btn:active, .ctrl-btn:active, .nav-btn:active { 
      opacity: 0.5;
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="app-title">籃球記分板</div>
      <button class="nav-btn" onclick="toggleFullScreen()">全螢幕</button>
    </header>

    <section class="timer-section">
      <div class="timer-display" id="timer">10:00</div>
      <div class="timer-controls">
        <button class="ctrl-btn btn-start" id="startBtn" onclick="toggleTimer()">開始</button>
        <button class="ctrl-btn btn-reset" onclick="resetAll()">重置</button>
      </div>
    </section>

    <section class="scoreboard">
      <!-- 主隊 -->
      <div class="team-card">
        <div class="team-name home-title">主隊</div>
        <div class="score-box">
          <div class="score-number home-score" id="homeScore">0</div>
        </div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore('home', 3)">3</button>
          <button class="score-btn" onclick="addScore('home', 2)">2</button>
          <button class="score-btn" onclick="addScore('home', 1)">1</button>
          <button class="score-btn" onclick="addScore('home', -1)">-1</button>
        </div>
      </div>

      <!-- 客隊 -->
      <div class="team-card">
        <div class="team-name guest-title">客隊</div>
        <div class="score-box">
          <div class="score-number guest-score" id="guestScore">0</div>
        </div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore('guest', 3)">3</button>
          <button class="score-btn" onclick="addScore('guest', 2)">2</button>
          <button class="score-btn" onclick="addScore('guest', 1)">1</button>
          <button class="score-btn" onclick="addScore('guest', -1)">-1</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    let totalSeconds = 600;
    let timerInterval = null;
    let isRunning = false;
    let scores = { home: 0, guest: 0 };

    function updateTimerDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      document.getElementById('timer').innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function toggleTimer() {
      const startBtn = document.getElementById('startBtn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.innerText = '開始';
        startBtn.style.backgroundColor = 'var(--green-btn)';
      } else {
        if (totalSeconds <= 0) return;
        isRunning = true;
        startBtn.innerText = '暫停';
        startBtn.style.backgroundColor = '#ff9500';
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerText = '開始';
            startBtn.style.backgroundColor = 'var(--green-btn)';
          }
        }, 1000);
      }
    }

    /* 集中單一重置按鈕：同時重置時間與分數 */
    function resetAll() {
      if (isRunning) toggleTimer();
      totalSeconds = 600;
      updateTimerDisplay();
      
      scores.home = 0;
      scores.guest = 0;
      document.getElementById('homeScore').innerText = 0;
      document.getElementById('guestScore').innerText = 0;
    }

    function addScore(team, points) {
      scores[team] = Math.max(0, scores[team] + points);
      document.getElementById(`${team}Score`).innerText = scores[team];
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.addEventListener('touchstart', function(event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
