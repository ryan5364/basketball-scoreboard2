<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>籃球記分板</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --btn-bg: #222222;
      --border-color: #333333;
      --primary-yellow: #ffcc00;
      --home-red: #ff453a;
      --guest-blue: #0a84ff;
      --green-btn: #34c759;
      --red-btn: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* 1. 頂導覽 (固定 36px) */
    header {
      height: 36px;
      background-color: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .app-title {
      color: var(--primary-yellow);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background-color: var(--btn-bg);
      border: 1px solid #444444;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 2. 計時區 (高度壓縮至最低) */
    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
      flex-shrink: 0;
    }

    .timer-display {
      font-family: "SF Pro Text", "Courier New", monospace;
      font-size: 14vh;
      font-weight: 800;
      color: var(--primary-yellow);
      line-height: 1;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .ctrl-btn {
      width: 90px;
      height: 32px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
    }

    /* 3. 記分主區 (固定左右 50% 並排，自動撐滿高) */
    .scoreboard {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 16px;
      padding: 0 16px 12px 16px;
      min-height: 0;
    }

    .team-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .team-name {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .home-title { color: var(--home-red); }
    .guest-title { color: var(--guest-blue); }

    /* 巨大分數框：以 vh 精準控制字體大小 */
    .score-box {
      flex: 1;
      background-color: #000000;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .score-number {
      font-size: 35vh;
      font-weight: 800;
      line-height: 1;
    }

    .home-score { color: var(--home-red); }
    .guest-score { color: var(--guest-blue); }

    /* 4. 底部加減按鈕 (固定高度 52px 絕對貼底) */
    .score-controls {
      display: flex;
      height: 52px;
      background-color: var(--btn-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .score-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-right: 1px solid #111111;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-btn:last-child {
      border-right: none;
    }

    .btn-start { background-color: var(--green-btn); }
    .btn-reset { background-color: var(--red-btn); }
    .score-btn:active, .ctrl-btn:active, .nav-btn:active { opacity: 0.6; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="app-title">籃球記分板</div>
      <div class="nav-buttons">
        <button class="nav-btn" onclick="toggleFullScreen()">全螢幕</button>
        <button class="nav-btn" onclick="alert('設定功能開發中')">⚙ 設定</button>
      </div>
    </header>

    <section class="timer-section">
      <div class="timer-display" id="timer">10:00</div>
      <div class="timer-controls">
        <button class="ctrl-btn btn-start" id="startBtn" onclick="toggleTimer()">開始</button>
        <button class="ctrl-btn btn-reset" onclick="resetTimer()">重置</button>
      </div>
    </section>

    <section class="scoreboard">
      <!-- 主隊 (左) -->
      <div class="team-card">
        <div class="team-name home-title">主隊</div>
        <div class="score-box">
          <div class="score-number home-score" id="homeScore">99</div>
        </div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore('home', 3)">3</button>
          <button class="score-btn" onclick="addScore('home', 2)">2</button>
          <button class="score-btn" onclick="addScore('home', 1)">1</button>
          <button class="score-btn" onclick="addScore('home', -1)">-1</button>
        </div>
      </div>

      <!-- 客隊 (右) -->
      <div class="team-card">
        <div class="team-name guest-title">客隊</div>
        <div class="score-box">
          <div class="score-number guest-score" id="guestScore">88</div>
        </div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore('guest', 3)">3</button>
          <button class="score-btn" onclick="addScore('guest', 2)">2</button>
          <button class="score-btn" onclick="addScore('guest', 1)">1</button>
          <button class="score-btn" onclick="addScore('guest', -1)">-1</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    let totalSeconds = 600;
    let timerInterval = null;
    let isRunning = false;

    function updateTimerDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      document.getElementById('timer').innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function toggleTimer() {
      const startBtn = document.getElementById('startBtn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.innerText = '開始';
        startBtn.style.backgroundColor = 'var(--green-btn)';
      } else {
        if (totalSeconds <= 0) return;
        isRunning = true;
        startBtn.innerText = '暫停';
        startBtn.style.backgroundColor = '#ff9500';
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerText = '開始';
            startBtn.style.backgroundColor = 'var(--green-btn)';
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (isRunning) toggleTimer();
      totalSeconds = 600;
      updateTimerDisplay();
    }

    let scores = { home: 99, guest: 88 };

    function addScore(team, points) {
      scores[team] = Math.max(0, scores[team] + points);
      document.getElementById(`${team}Score`).innerText = scores[team];
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('touchstart', function(event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
