<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>籃球計分板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-a-bg: #1e293b;
      --card-b-bg: #1e293b;
      --text-a: #38bdf8;
      --text-b: #f43f5e;
      --accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部控制列 */
    header {
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:active {
      opacity: 0.8;
    }

    /* 主計分區塊 */
    main {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 50px);
    }

    .team-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .team-a {
      background-color: var(--card-a-bg);
      border-right: 2px solid #0f172a;
    }

    .team-b {
      background-color: var(--card-b-bg);
    }

    .score {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-weight: bold;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .team-a .score {
      color: var(--text-a);
    }

    .team-b .score {
      color: var(--text-b);
    }

    /* 直屏設定 (Portrait) */
    @media (orientation: portrait) {
      main {
        flex-direction: column;
      }
      .team-a {
        border-right: none;
        border-bottom: 2px solid #0f172a;
      }
      .score {
        font-size: 40vh; /* 調整為 40vh，防止雙位數溢出 */
      }
    }

    /* 橫屏設定 (Landscape) */
    @media (orientation: landscape) {
      main {
        flex-direction: row;
      }
      .score {
        font-size: 50vh; /* 保持 50vh */
      }
    }
  </style>
</head>
<body>

  <header>
    <button class="btn" id="reset-btn">重置分數</button>
    <div style="font-size: 14px; color: #94a3b8;">點擊加分 | 長按減分</div>
  </header>

  <main>
    <div class="team-card team-a" id="team-a">
      <div class="score" id="score-a">0</div>
    </div>
    <div class="team-card team-b" id="team-b">
      <div class="score" id="score-b">0</div>
    </div>
  </main>

  <script>
    // 快取名稱與靜態預快取清單
    const CACHE_NAME = 'basketball-scoreboard-v1';
    const CACHE_ASSETS = [
      location.href,
      location.pathname
    ];

    // CacheStorage 靜態預快取邏輯
    async function initOfflineCache() {
      if ('caches' in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          await cache.addAll(CACHE_ASSETS);
        } catch (err) {
          console.error('CacheStorage 預快取失敗:', err);
        }
      }
    }

    // 初始化計分與事件處理
    let scoreA = 0;
    let scoreB = 0;

    const elScoreA = document.getElementById('score-a');
    const elScoreB = document.getElementById('score-b');
    const elTeamA = document.getElementById('team-a');
    const elTeamB = document.getElementById('team-b');
    const btnReset = document.getElementById('reset-btn');

    function updateDisplay() {
      elScoreA.textContent = scoreA;
      elScoreB.textContent = scoreB;
    }

    // 長按觸發扣分邏輯
    function attachScoreEvents(element, getScore, setScore) {
      let timer = null;
      let isLongPress = false;

      element.addEventListener('touchstart', (e) => {
        isLongPress = false;
        timer = setTimeout(() => {
          isLongPress = true;
          const current = getScore();
          if (current > 0) {
            setScore(current - 1);
            updateDisplay();
          }
        }, 600);
      }, { passive: true });

      element.addEventListener('touchend', (e) => {
        clearTimeout(timer);
        if (!isLongPress) {
          setScore(getScore() + 1);
          updateDisplay();
        }
      });

      element.addEventListener('touchmove', () => {
        clearTimeout(timer);
      }, { passive: true });

      element.addEventListener('click', (e) => {
        // 防止案案在桌面端與觸控端重複觸發
        if (e.pointerType === 'mouse') {
          setScore(getScore() + 1);
          updateDisplay();
        }
      });
    }

    attachScoreEvents(elTeamA, () => scoreA, (v) => scoreA = v);
    attachScoreEvents(elTeamB, () => scoreB, (v) => scoreB = v);

    btnReset.addEventListener('click', () => {
      scoreA = 0;
      scoreB = 0;
      updateDisplay();
    });

    // 頁面載入完成後執行離線快取註冊
    window.addEventListener('load', () => {
      initOfflineCache();
    });
  </script>
</body>
</html>
