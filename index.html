<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="籃球記分板">
  <title>籃球比賽記分板</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --border: #333333;
      --yellow: #ffcc00;
      --red: #ff3b30;
      --blue: #0a84ff;
      --green: #34c759;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 12px 16px;
      gap: 10px;
    }

    /* 頂部導覽列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
      flex-shrink: 0;
    }

    .title {
      color: var(--yellow);
      font-size: 1.2rem;
      font-weight: bold;
    }

    .fullscreen-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 中央計時區 */
    .timer-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .timer-text {
      font-family: "SF Pro Text", monospace;
      font-size: 14vh;
      font-weight: 900;
      color: var(--yellow);
      line-height: 1;
    }

    .timer-ctrls {
      display: flex;
      gap: 16px;
      margin-top: 6px;
    }

    .ctrl-btn {
      width: 110px;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }

    .btn-start { background-color: var(--green); }
    .btn-reset { background-color: var(--red); }

    /* 記分與按鈕主區 (雙欄獨立) */
    .scoreboard {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      min-height: 0;
    }

    .team-col {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 8px;
    }

    .team-name {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      flex-shrink: 0;
    }

    .name-home { color: var(--red); }
    .name-guest { color: var(--blue); }

    /* 分數大框 */
    .score-display {
      flex: 1;
      background: #000;
      border: 2px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    /* 分數字體加大至 36vh */
    .score-text {
      font-size: 36vh;
      font-weight: 900;
      line-height: 1;
    }

    .score-home { color: var(--red); }
    .score-guest { color: var(--blue); }

    /* 底部加減按鈕區 */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      height: 80px;
      flex-shrink: 0;
    }

    .btn-point {
      background: #1c1c1e;
      border: 1.5px solid #3a3a3c;
      border-radius: 10px;
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-point:active, .ctrl-btn:active, .fullscreen-btn:active {
      opacity: 0.5;
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <div class="title">籃球比賽記分板</div>
      <button class="fullscreen-btn" onclick="toggleFullScreen()">全螢幕</button>
    </header>

    <section class="timer-box">
      <div class="timer-text" id="timer">10:00</div>
      <div class="timer-ctrls">
        <button class="ctrl-btn btn-start" id="startBtn" onclick="toggleTimer()">開始</button>
        <button class="ctrl-btn btn-reset" onclick="resetAll()">重置</button>
      </div>
    </section>

    <section class="scoreboard">
      <!-- 主隊 -->
      <div class="team-col">
        <div class="team-name name-home">主 隊</div>
        <div class="score-display">
          <div class="score-text score-home" id="homeScore">0</div>
        </div>
        <div class="btn-group">
          <button class="btn-point" onclick="addScore('home', 3)">+3</button>
          <button class="btn-point" onclick="addScore('home', 2)">+2</button>
          <button class="btn-point" onclick="addScore('home', 1)">+1</button>
          <button class="btn-point" style="color: var(--red);" onclick="addScore('home', -1)">-1</button>
        </div>
      </div>

      <!-- 客隊 -->
      <div class="team-col">
        <div class="team-name name-guest">客 隊</div>
        <div class="score-display">
          <div class="score-text score-guest" id="guestScore">0</div>
        </div>
        <div class="btn-group">
          <button class="btn-point" onclick="addScore('guest', 3)">+3</button>
          <button class="btn-point" onclick="addScore('guest', 2)">+2</button>
          <button class="btn-point" onclick="addScore('guest', 1)">+1</button>
          <button class="btn-point" style="color: var(--blue);" onclick="addScore('guest', -1)">-1</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    let totalSeconds = 600;
    let timerInterval = null;
    let isRunning = false;
    let scores = { home: 0, guest: 0 };
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type, duration) {
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playMinuteChime() {
      playTone(600, 'sine', 0.2);
      setTimeout(() => playTone(850, 'sine', 0.4), 180);
    }

    function playCountdownBeep() {
      playTone(750, 'square', 0.12);
    }

    function playBoxingBell() {
      initAudio();
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
          } catch(e){}
        }, i * 350);
      }
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      document.getElementById('timer').innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function toggleTimer() {
      initAudio();
      const startBtn = document.getElementById('startBtn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.innerText = '開始';
        startBtn.style.backgroundColor = 'var(--green)';
      } else {
        if (totalSeconds <= 0) return;
        isRunning = true;
        startBtn.innerText = '暫停';
        startBtn.style.backgroundColor = '#ff9500';
        
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateTimerDisplay();

            if (totalSeconds === 180 || totalSeconds === 120 || totalSeconds === 60) {
              playMinuteChime();
            } else if (totalSeconds <= 10 && totalSeconds > 0) {
              playCountdownBeep();
            } else if (totalSeconds === 0) {
              playBoxingBell();
            }
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerText = '開始';
            startBtn.style.backgroundColor = 'var(--green)';
          }
        }, 1000);
      }
    }

    function resetAll() {
      if (isRunning) toggleTimer();
      totalSeconds = 600;
      updateTimerDisplay();
      
      scores.home = 0;
      scores.guest = 0;
      document.getElementById('homeScore').innerText = 0;
      document.getElementById('guestScore').innerText = 0;
    }

    function addScore(team, points) {
      initAudio();
      scores[team] = Math.max(0, scores[team] + points);
      document.getElementById(`${team}Score`).innerText = scores[team];
    }

    function toggleFullScreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.addEventListener('touchstart', function(event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
